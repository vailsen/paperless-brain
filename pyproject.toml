[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-brain"
dynamic = ["version"]
description = "AI brain for your Paperless-ngx archive — chat with your documents via local or cloud LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Valentin Pichlmaier" }]
keywords = ["paperless-ngx", "ai", "rag", "llm", "document-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]

# Direct imports only; everything else is transitive.
# Floors = versions the app was last smoke-tested with (2026-07-19).
dependencies = [
    "nicegui>=3.14,<4",
    "fastapi>=0.139",
    "aiohttp>=3.14",
    "httpx>=0.28",
    "requests>=2.34",
    "anthropic>=0.117",
    "chromadb>=1.5.9,<2",
    "sentence-transformers>=5.6",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14",
    "cryptography>=48",
    "pypdfium2>=5.12",
    "weasyprint>=69",
    "python-docx>=1.2",
    "pillow>=12",
    "lxml>=6",
    # [latex] pulls latex2mathml — chat renders markdown with the "latex" extra
    # (app_ui/pages/chat.py:_MD_EXTRAS); without it every message raises ImportError.
    "markdown2[latex]>=2.5",
    "trafilatura>=2.1",
    "snowballstemmer>=2.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Headless-browser web crawling (chat web tool fallback for JS-heavy pages).
# Without it the app still runs; page fetching uses trafilatura only.
crawl = ["crawl4ai>=0.9.2"]
# i18n catalog workflow (pybabel extract/update/compile) — not needed at runtime.
i18n = ["babel>=2.18"]
# Test suite. babel is used by the catalog-integrity tests, so it is included.
dev = ["pytest>=8.4", "babel>=2.18"]

[project.urls]
Homepage = "https://github.com/Vailsen/paperless-brain"

[tool.hatch.version]
path = "config/version.py"

[tool.hatch.build.targets.wheel]
packages = ["app_ui", "config", "models", "pipelines", "services", "vault", "werkbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
