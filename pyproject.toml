[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-brain"
dynamic = ["version"]
description = "AI brain for your Paperless-ngx archive — chat with your documents via local or cloud LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Valentin Pichlmaier" }]
keywords = ["paperless-ngx", "ai", "rag", "llm", "document-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]

# Direct imports only; everything else is transitive.
# Floors = versions the app was last smoke-tested with (2026-07-19).
dependencies = [
    "nicegui>=3.16,<4",
    "fastapi>=0.141,<1",
    "aiohttp>=3.14.3,<4",
    "httpx>=0.28,<1",
    "requests>=2.34,<3",
    # Every range here carries an upper bound, and the floors track what the
    # dev venv actually has. Both rules exist because this range was once open:
    # the dev machine resolved anthropic 0.117 and the image resolved 1.4.0, so
    # every Anthropic call in the container died on a parameter 1.x had removed
    # while the tests passed locally. An unbounded floor means dev and image are
    # different builds of the same commit.
    "anthropic>=1.4,<2",
    "chromadb>=1.5.9,<2",
    "sentence-transformers>=6.0,<7",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "cryptography>=50,<51",
    "pypdfium2>=5.13,<6",
    "weasyprint>=70,<71",
    "python-docx>=1.2,<2",
    "pillow>=12,<13",
    "lxml>=6.1.3,<7",
    # [latex] pulls latex2mathml — chat renders markdown with the "latex" extra
    # (app_ui/pages/chat.py:_MD_EXTRAS); without it every message raises ImportError.
    "markdown2[latex]>=2.5,<3",
    "trafilatura>=2.2,<3",
    # Stays on 2.x: crawl4ai pins `snowballstemmer~=2.2`, so the [crawl] extra
    # would make any higher floor unresolvable. 3.x is API-compatible with the
    # one call this makes (`stemmer("german").stemWord`), so a LEAN build that
    # resolves 3.x behaves the same.
    "snowballstemmer>=2.2,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Headless-browser web crawling (chat web tool fallback for JS-heavy pages).
# Without it the app still runs; page fetching uses trafilatura only.
crawl = ["crawl4ai>=0.9.3,<1"]
# i18n catalog workflow (pybabel extract/update/compile) — not needed at runtime.
i18n = ["babel>=2.18"]
# Test suite. babel is used by the catalog-integrity tests, so it is included.
dev = ["pytest>=8.4", "babel>=2.18"]

[project.urls]
Homepage = "https://github.com/Vailsen/paperless-brain"

[tool.hatch.version]
path = "config/version.py"

[tool.hatch.build.targets.wheel]
packages = ["app_ui", "config", "models", "pipelines", "services", "vault", "werkbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
